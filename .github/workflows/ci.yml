name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Full build (GUI + CLI + tests) using the bundled prebuilt V-ImageProcessing
  # static library (third_party/v_imageprocessing/lib/linux-x86_64/libV_2D.a),
  # followed by the full CTest suite (37 unit/integration tests).
  # ---------------------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libdcmtk-dev

      - name: Configure (CMake)
        run: cmake -B build

      - name: Build (GUI + CLI + tests)
        run: cmake --build build -j"$(nproc)"

      - name: Run tests (CTest)
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # clang-format compliance check (src/ only -- cli/ and tests/ are not
  # enforced here). Pinned to a specific clang-format version (installed via
  # pip, not apt) so CI formatting rules stay deterministic across runner
  # image updates -- apt's distro-shipped clang-format version drifts with
  # the Ubuntu release and can disagree with itself across major versions.
  # ---------------------------------------------------------------------------
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install clang-format
        run: pip install clang-format==23.1.3

      - name: Check formatting (src/ only)
        run: |
          find src -regex '.*\.\(cpp\|h\)' -print0 \
            | xargs -0 -n1 clang-format --dry-run --Werror

